<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة غير موجودة | شركة العزل المتقدم</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
            background: linear-gradient(135deg, #0a1628 0%, #0e4a86 60%, #1a73c7 130%); color: #fff; padding: 2rem;
        }
        .wrap { max-width: 30rem; }
        .code { font-size: clamp(5rem, 18vw, 8rem); font-weight: 900; line-height: 1; background: linear-gradient(120deg, #f59e0b, #fbbf24, #f59e0b); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        h1 { font-size: 1.6rem; margin: 1.2rem 0 0.6rem; }
        p { color: rgba(219, 234, 254, 0.85); margin-bottom: 2rem; }
        a { display: inline-block; background: #f59e0b; color: #fff; font-weight: 800; padding: 0.9rem 2rem; border-radius: 999px; text-decoration: none; transition: transform 0.25s ease; }
        a:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <main class="wrap">
        <div class="code">404</div>
        <h1>الصفحة غير موجودة</h1>
        <p>عذراً، الصفحة التي تبحث عنها غير متوفرة أو تم نقلها.</p>
        <a href="/">العودة إلى الرئيسية</a>
    </main>
</body>
</html>
