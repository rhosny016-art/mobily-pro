<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="دلّني - وكالة تسويق رقمي متكاملة. إنشاء وتحسين خرائط Google، إدارة حملات إعلانية، وكتابة التعليقات والمراجعات." />
    <meta name="keywords" content="تسويق رقمي, خرائط جوجل, Google Maps, Google Ads, إعلانات, مصر" />
    <meta name="theme-color" content="#060B24" />
    <meta property="og:title" content="دلّني | وكالة تسويق رقمي متكاملة" />
    <meta property="og:description" content="نضع عملك على خريطة Google - خدمات تسويق رقمي احترافية" />
    <meta property="og:type" content="website" />
    <title>دلّني | وكالة تسويق رقمي متكاملة</title>

    <!-- Fonts: preconnect + async load (non render-blocking).
         Cairo weights only (400/700/900), font-display swap, system fallback stack
         prevents invisible-text (FOIT) and layout shift before the webfont lands. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" />
    </noscript>
    <style>
      /* Render the brand text immediately with the closest system fallback so the
         hero headline paints before the webfont arrives (anti-FOUC). */
      :root { --dalni-fallback: "Tahoma", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      html, body { font-family: var(--dalni-fallback); }
      /* Pre-paint the page background to avoid a white flash before the bundle boots. */
      body { background: #EEF2F7; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
